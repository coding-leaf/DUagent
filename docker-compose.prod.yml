services:
  mysql:
    image: mysql:8.0
    container_name: eduagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-duagent}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - eduagent_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: eduagent-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - eduagent_qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: eduagent-agentscope-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - eduagent_redis_data:/data

volumes:
  eduagent_mysql_data:
    name: eduagent_mysql_data
  eduagent_qdrant_data:
    name: eduagent_qdrant_data
  eduagent_redis_data:
    name: eduagent_redis_data
