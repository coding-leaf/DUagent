<!DOCTYPE html>
<html>
<head>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.esm.mjs';
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
    async function run() {
      try {
        const result = await mermaid.render('test1', 'graph TD\\nA-->B');
        document.getElementById('out').innerHTML = result.svg;
      } catch (e) {
        document.getElementById('out').innerHTML = e.message;
      }
    }
    run();
  </script>
</head>
<body>
  <div id="out"></div>
</body>
</html>
